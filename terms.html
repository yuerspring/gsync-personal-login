<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人 GSync 使用说明</title><style>body{font:18px/1.7 system-ui;max-width:42rem;margin:8vh auto;padding:24px}</style><h1>个人 GSync 使用说明</h1><p>此页面供账号所有者配合 Obsidian GSync 完成个人 Google 登录，页面本身免费。Google Drive 的存储容量和 API 配额适用 Google 的服务规则。</p><p>在 Obsidian 发起登录，并在同一设备完成返回操作。重要文件请保留独立备份，同步冲突需要核对处理。</p><p>本页面由账号所有者管理。GSync、Obsidian、Google 和 GitHub 是各自独立的第三方项目或服务，按各自的条款使用。</p><a href="index.html">返回登录页</a></html>
